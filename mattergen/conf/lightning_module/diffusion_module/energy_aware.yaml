# Energy-Aware Diffusion Module Configuration
# This configuration enables physics-aware training with energy supervision.
# The model predicts per-structure energy and is supervised using DFT formation energies.

_target_: mattergen.diffusion.diffusion_module.DiffusionModule

loss_fn:
  _target_: mattergen.common.loss.EnergyAwareMaterialsLoss
  reduce: sum
  include_pos: True
  include_cell: True
  include_atomic_numbers: True
  d3pm_hybrid_lambda: 0.01
  # Energy-specific parameters
  energy_weight: 0.1  # Weight for energy loss term
  energy_target_key: "formation_energy_per_atom"  # Key in batch for target energy
  energy_pred_key: "predicted_energy"  # Key in model output for predicted energy
  weights:
    cell: 1.0
    pos: 0.1
    atomic_numbers: 1.0

model: mattergen_energy_aware
corruption: default

pre_corruption_fn:
  _target_: mattergen.property_embeddings.SetEmbeddingType
  p_unconditional: 0.2
  dropout_fields_iid: false
